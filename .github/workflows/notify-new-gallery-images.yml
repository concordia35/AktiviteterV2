name: Kontroller nye godkendte billeder

on:
  # Kører hvert kvarter, forskudt fra de andre automatiske kontroller.
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/notify-new-gallery-images.yml'
      - '.github/scripts/notify_new_gallery_images.py'

permissions:
  contents: write

concurrency:
  group: concordia-gallery-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find nye godkendte billeder og send push
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python3 .github/scripts/notify_new_gallery_images.py

      - name: Gem hvilke billeder der allerede er behandlet
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- .github/state/seen_gallery_images.json; then
            echo "Ingen ændring i galleri-state."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/seen_gallery_images.json
          git commit -m "Opdater galleri-notifikationsstatus [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
